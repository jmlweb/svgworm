name: Site

# Deploys apps/site to Cloudflare Workers static assets (ADR-0016): production on every push
# to main, a preview version aliased pr-<number> on every same-repo PR. Fork PRs get no
# secrets, so the job is skipped for them instead of failing.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site (${{ github.event_name == 'push' && 'production' || 'preview' }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Never deploy a page that fails the zero-client-JS and sprite checks.
      - run: pnpm site:check
      - name: Deploy to production
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter svgworm-site exec wrangler deploy | tee wrangler.log
          grep -Eo 'https://[^ ]+\.workers\.dev' wrangler.log | sed 's/^/Production: /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter svgworm-site exec wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER $HEAD_SHA" | tee wrangler.log
          grep -Eo 'https://[^ ]+\.workers\.dev' wrangler.log | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
