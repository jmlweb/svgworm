name: Release

# ADR-0009: Changesets keeps a "Version Packages" PR open on `main`. Merging it publishes
# both packages through npm trusted publishing (OIDC, no stored token) and creates the
# GitHub releases. The npm side (org, trusted publisher per package pointing at this file
# and the `npm-publish` environment) is set up by hand before the first release: see
# docs/release.md.
#
# Three jobs with the least privilege each needs (2026-10-13 security review):
#   plan     counts the pending changesets with a read-only token and decides which of the
#            next two runs. It runs no tests: changes reach `main` through CI, and the
#            Version PR gets the same CI because it is opened with a PAT (see below);
#   version  opens or updates the Version PR while changesets are pending, and turns on
#            auto-merge for it. The PR merges itself once the required checks of the `main`
#            branch protection pass;
#   publish  runs only with no pending changesets, inside the `npm-publish` environment
#            (required reviewer, `main` only), and is the only job that can mint an npm token.
#
# RELEASE_PAT (fine-grained, this repo only: Contents and Pull requests read/write) is needed
# because a PR opened with GITHUB_TOKEN does not trigger CI, so the required checks would
# never run and auto-merge would wait forever. See docs/release.md.
# Every action is pinned to a commit (Dependabot bumps them) and the toolchain to a major.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Forks have no npm trusted publisher and must not open version PRs.
    if: github.repository == 'jmlweb/svgworm'
    outputs:
      pending-changesets: ${{ steps.changesets.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pending changesets?
        id: changesets
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -gt 0 ]; then echo "pending=true" >> "$GITHUB_OUTPUT"; else echo "pending=false" >> "$GITHUB_OUTPUT"; fi
          echo "$count pending changeset(s)"

  version:
    name: Version PR
    needs: plan
    if: needs.plan.outputs.pending-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      # Only the changesets CLI is needed here; no lifecycle script of any package runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open or update the Version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          # A PAT, not GITHUB_TOKEN: pushes and PRs made with GITHUB_TOKEN do not trigger CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      # Merges only after the required checks pass. Without required checks `--auto` fails
      # instead of merging an untested PR.
      - name: Auto-merge the Version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish to npm
    needs: plan
    if: needs.plan.outputs.pending-changesets == 'false'
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval (Actions → Review deployments) before anything
    # below runs; the npm trusted publisher is bound to this environment name.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (the Node 24 runner ships a newer one; this
      # keeps it true if the runner image changes, without following an unpinned `latest`).
      - run: npm install -g npm@11
      - run: npm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Tests already ran on the merged Version PR; this re-checks only what gets published.
      - run: pnpm build
      - run: pnpm check:packages
      - name: Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Belt and braces (ADR-0009): provenance is automatic under trusted publishing,
          # and asking for it explicitly costs nothing.
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: echo "$PUBLISHED"
