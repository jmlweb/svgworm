packages:
  - packages/*
  - examples/*
  - apps/*
  - tests/conformance

# One @types/node, the root pin: the sitemap integration (ADR-0018) depends on a newer major,
# which would split the vite peer instances and leave the vitest configs untyped.
minimumReleaseAgeExclude:
  - '@astrojs/runtime@0.1.2'
  - '@astrojs/sitemap@3.7.6'
  - '@cloudflare/kv-asset-handler@0.5.1'
  - '@cloudflare/workers-utils@0.55.0'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - astro@7.4.13
  - miniflare@5.20261118.0-beta
  - svelte@5.58.0
  - vitest@5.1.1
  - wrangler@4.165.0

overrides:
  '@types/node': 22.20.5

# pnpm 11+ fails the install on unreviewed build scripts. Neither is needed: esbuild ships
# platform binaries as optional packages and workerd only runs under `wrangler dev`.
allowBuilds:
  esbuild: false
  workerd: false
