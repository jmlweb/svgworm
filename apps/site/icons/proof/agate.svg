  <g clip-path="url(#stone)" fill="none" stroke="url(#band)" stroke-width="1.8">
    <ellipse cx="19" cy="18" rx="4" ry="2.8"/>
    <ellipse cx="19" cy="18" rx="7.5" ry="5.600"/>
    <ellipse cx="19" cy="18" rx="11.500" ry="9"/>
