<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Agate pebble, drawn for this site. Gradients and a clip path. -->
  <defs>
    <radialGradient id="rind" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#de8f8a"/>
      <stop offset="0.6" stop-color="#b85c5e"/>
      <stop offset="1" stop-color="#6e2a32"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f0"/>
